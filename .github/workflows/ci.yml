name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier (check)
        run: npm run format:check

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm test -- --no-cache --runInBand
        env:
          NODE_ENV: test
          CI: true

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build
        run: npm run build
